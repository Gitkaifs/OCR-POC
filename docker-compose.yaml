
services:
  backend:
    build: ./backend-node
    container_name: OCR-Backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend-node/uploads:/app/uploads
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name : OCR-mongo
    ports:
      - "27017:27017"
    volumes:
      - OCR_mongo_data:/data/db

volumes:
  OCR_mongo_data:
